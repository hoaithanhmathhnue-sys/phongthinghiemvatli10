<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics AI-Lab 10 | Phòng thí nghiệm ảo Vật lí lớp 10</title>
    <meta name="description" content="Phòng thí nghiệm ảo môn Vật lí lớp 10 tích hợp trí tuệ nhân tạo sư phạm theo Chương trình GDPT 2018 (SGK Kết nối tri thức)." />
    <meta property="og:title" content="Physics AI-Lab 10 | Phòng thí nghiệm ảo Vật lí lớp 10" />
    <meta property="og:description" content="Phòng thí nghiệm ảo môn Vật lí lớp 10 tích hợp trí tuệ nhân tạo sư phạm theo Chương trình GDPT 2018 (SGK Kết nối tri thức)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- MathJax 3 — Render công thức Vật lí trực quan -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']],
          processEscapes: true,
          processEnvironments: true,
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          ignoreHtmlClass: 'no-mathjax',
        },
        startup: {
          pageReady: () => {
            return window.MathJax.startup.defaultPageReady();
          }
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      /* MathRenderer styles — Tương thích hoàn hảo cả sáng và tối */
      .math-renderer {
        color: inherit;
        line-height: 1.7;
        font-size: 13px;
      }
      .math-renderer p { margin: 0.25em 0; }
      .math-renderer strong { font-weight: 700; color: inherit; }
      .math-renderer em { font-style: italic; }
      .math-renderer .math-heading { font-weight: 700; margin: 0.5em 0 0.25em; color: #1e3a5f; }
      .dark .math-renderer .math-heading { color: #93c5fd; }
      .math-renderer h2.math-heading { font-size: 1.1em; }
      .math-renderer h3.math-heading { font-size: 1em; }
      .math-renderer h4.math-heading { font-size: 0.95em; }
      .math-renderer .math-list,
      .math-renderer .math-list-ol { padding-left: 1.5em; margin: 0.3em 0; }
      .math-renderer .math-list-item,
      .math-renderer .math-list-item-ol { margin: 0.15em 0; }
      .math-renderer .math-code-block {
        background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 6px;
        padding: 8px 12px; overflow-x: auto; font-family: 'JetBrains Mono', monospace;
        font-size: 12px; margin: 0.4em 0; white-space: pre-wrap;
      }
      .dark .math-renderer .math-code-block {
        background: #1e293b; border-color: #334155; color: #e2e8f0;
      }
      .math-renderer .math-inline-code {
        background: #f0f0f0; padding: 1px 5px; border-radius: 3px;
        font-family: 'JetBrains Mono', monospace; font-size: 12px;
      }
      .dark .math-renderer .math-inline-code {
        background: #334155; color: #e2e8f0;
      }
      .math-renderer .math-block {
        text-align: center; margin: 0.6em 0; padding: 0.4em;
        background: #fafafa; border-radius: 6px; border: 1px solid #eee;
      }
      .dark .math-renderer .math-block {
        background: #0f172a; border-color: #1e293b; color: inherit;
      }
      .math-renderer .math-inline { display: inline; }
      /* MathJax output kế thừa màu chữ container để thích ứng chuẩn xác Light / Dark mode */
      .math-renderer .MathJax,
      .math-renderer mjx-container,
      .math-renderer mjx-container * {
        color: inherit !important;
        fill: currentColor !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
